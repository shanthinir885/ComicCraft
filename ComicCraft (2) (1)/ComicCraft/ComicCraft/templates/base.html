<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080812" />
  <meta name="description" content="ComicCraft turns your ideas into AI-generated comics with original stories, characters, dialogue and illustrations." />
  <title>{% block title %}{{ app_name }} — AI Comic Story Creator{% endblock %}</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  {% include "partials/navbar.html" %}

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <div class="toast-stack" id="toastStack" role="status" aria-live="polite" aria-atomic="true"></div>

  {% include "partials/loading.html" %}

  <script src="/static/js/app.js" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
